version: v2
plugins:
  - local: protoc-gen-go
    out: example
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: example
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - local: protoc-gen-grpc-mock
    out: example
    opt: paths=source_relative
inputs:
  - directory: example
